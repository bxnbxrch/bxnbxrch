name: Metrics

on:
  # Runs daily; also runnable on demand from the Actions tab / CLI.
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # Personal Access Token (classic) with `public_repo` scope,
          # stored as the repo secret METRICS_TOKEN.
          token: ${{ secrets.METRICS_TOKEN }}
          user: bxnbxrch
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/London

          # Isometric 3D contribution calendar (the eye-catching one)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most used languages
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8

          # Coding habits / active hours
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
